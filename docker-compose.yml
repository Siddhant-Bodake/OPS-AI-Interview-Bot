# Optional local stack. Manual run (uvicorn + streamlit + external Postgres) is the default.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-interview_bot}
    ports:
      - "5432:5432"
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:${DB_PORT:-5432}/${DB_NAME:-interview_bot}}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  streamlit:
    build: .
    command: streamlit run streamlit_app/candidate_form.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      - FASTAPI_BASE_URL=${FASTAPI_BASE_URL:-http://api:8000}
    ports:
      - "8501:8501"
    depends_on:
      - api
